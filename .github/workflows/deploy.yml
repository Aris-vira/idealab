
name: Publicar Idea Lab en GitHub Pages

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Idea Lab
        run: npm run build -- --configuration production --base-href /idealab/

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar Idea Lab
        id: deployment
        uses: actions/deploy-pages@v4
